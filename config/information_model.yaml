domain: hr_hiring_process
version: "1.0"

categories:
  personal_information:
    description: "Candidate PII and demographic data"
    subcategories:
      - identity          # Full name, date of birth, nationality, ID numbers
      - contact_details   # Email, phone, address, LinkedIn profile

  professional_background:
    description: "Work experience and career history"
    subcategories:
      - employment_history  # Previous roles, companies, durations, responsibilities
      - skills_and_tools    # Technical skills, certifications, tools, languages
      - references          # Professional references and recommendation letters

  education:
    description: "Academic qualifications and training"
    subcategories:
      - academic_degrees        # Degrees, institutions, graduation dates, GPA
      - certifications_training # Professional certifications, courses, bootcamps

  compensation:
    description: "Financial expectations and requirements"
    subcategories:
      - salary_expectation   # Expected salary range, currency, benefits requirements
      - current_compensation # Current salary (if disclosed), bonus structure

  evaluation:
    description: "Internal hiring process assessment data"
    subcategories:
      - recruiter_notes    # Internal recruiter screening notes and scores
      - interview_feedback # Interviewer evaluations and ratings
