together_ai:
  base_url: "https://api.together.xyz/v1"
  embedding_model: "togethercomputer/m2-bert-80M-8k-retrieval"
  embedding_fallback_model: "BAAI/bge-base-en-v1.5"
  llm_model: "meta-llama/Llama-3.1-8B-Instruct"
  llm_fallback_model: "mistralai/Mistral-7B-Instruct-v0.3"
  temperature: 0.3
  max_tokens: 1024
  embedding_batch_size: 32
  retry_attempts: 3
  retry_delay_seconds: 1

pinecone:
  index_name: "cv-chunks"
  namespace: "default"
  metric: "cosine"
  dimension: 1024  # matches multilingual-e5-large-instruct
  n_results: 10

snowflake:
  database: "SECURERAG"
  schema: "RAG_DATA"
  warehouse: "COMPUTE_WH"
  tables:
    raw_documents: "BRONZE_RAW_DOCUMENTS"
    classified_chunks: "SILVER_CLASSIFIED_CHUNKS"
    indexed_vectors: "GOLD_INDEXED_VECTORS"
    audit_log: "AUDIT_QUERY_LOG"

chunking:
  chunk_size: 512
  chunk_overlap: 64
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "
    - ""

kafka:
  enabled: false   # Override with KAFKA_ENABLED env var
  watch_directory: "./data/incoming_cvs"
  fallback_direct_ingest: true

api:
  host: "0.0.0.0"
  port: 8000
  title: "SecureRAG API"
  version: "1.0.0"

audit:
  log_path: "./data/audit.jsonl"
  max_recent_entries: 1000
